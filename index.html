<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>インポートテキスト管理 + Gemini RAG</title>

<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: system-ui, sans-serif;
}
body { display: flex; }

/* ===== レイアウト ===== */
#sidebar {
  width: 260px;
  border-right: 1px solid #ccc;
  padding: 10px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}
#sidebar.hidden { display: none; }
#main {
  flex: 1;
  padding: 12px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}
#pageList button {
  width: 100%;
  text-align: left;
  margin-bottom: 4px;
}
#content, textarea {
  flex: 1;
  border: 1px solid #ccc;
  padding: 10px;
  white-space: pre-wrap;
  box-sizing: border-box;
}
textarea { display: none; }

/* ===== RAG ===== */
#rag {
  border-top: 1px solid #ccc;
  margin-top: 10px;
  padding-top: 10px;
}
#answer {
  margin-top: 10px;
  white-space: pre-wrap;
  border: 1px solid #ccc;
  padding: 10px;
  background: #f9f9f9;
  font-size: 14px;
}
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>

<body>

<div id="sidebar">
  <button id="add">＋ ページ追加</button>
  <div id="pageList"></div>
</div>

<div id="main">
  <h2 id="pageTitle"></h2>

  <div>
    <button id="edit">編集</button>
    <button id="save" style="display:none">保存</button>
    <button id="copyText">本文コピー</button>
  </div>

  <div id="content"></div>
  <textarea id="editor"></textarea>

  <!-- ===== RAG ===== -->
  <div id="rag">
    <input id="question" placeholder="このメモについて質問…" style="width:100%">
    <button id="ask">🤖 AIに聞く</button>
    <div id="answer"></div>
  </div>
</div>

<script>
/* ===== ★ Gemini API キー（必ず自分のものに置換） ===== */
const GEMINI_API_KEY = "ここに自分のGemini_API_KEY";

/* ===== Firebase ===== */
firebase.initializeApp({
  apiKey: "AIzaSyCnkShkUx2dj_nGn2-GuyNGShc5ooh55h8",
  authDomain: "importtext-b229d.firebaseapp.com",
  projectId: "importtext-b229d"
});
const auth = firebase.auth();
const db = firebase.firestore();

/* ===== データ ===== */
let data = { pages: [] };
let index = 0;
let editing = false;

const pageList = document.getElementById("pageList");
const titleEl = document.getElementById("pageTitle");
const contentEl = document.getElementById("content");
const editorEl = document.getElementById("editor");

/* ===== Firestore ===== */
auth.signInAnonymously().then(() => {
  const ref = db.collection("app").doc("pages");

  ref.onSnapshot(doc => {
    if (doc.exists) {
      data = doc.data();
    } else {
      data = { pages: [{ title:"ページ1", text:"" }]};
      ref.set(data);
    }
    render();
  });

  function save() {
    ref.set(data);
  }

  document.getElementById("add").onclick = () => {
    data.pages.push({ title:"新しいページ", text:"" });
    index = data.pages.length - 1;
    save();
  };

  document.getElementById("edit").onclick = () => {
    editing = true;
    editorEl.value = contentEl.textContent;
    editorEl.style.display = "block";
    contentEl.style.display = "none";
    saveBtn.style.display = "inline";
  };

  document.getElementById("save").onclick = () => {
    data.pages[index].text = editorEl.value;
    editing = false;
    editorEl.style.display = "none";
    contentEl.style.display = "block";
    saveBtn.style.display = "none";
    save();
  };

  document.getElementById("copyText").onclick = async () => {
    const text = editing ? editorEl.value : contentEl.textContent;
    await navigator.clipboard.writeText(text);
    alert("コピーしました");
  };

  function render() {
    pageList.innerHTML = "";
    data.pages.forEach((p,i)=>{
      const b = document.createElement("button");
      b.textContent = p.title;
      b.onclick = ()=>{ index=i; render(); };
      pageList.appendChild(b);
    });
    titleEl.textContent = data.pages[index].title;
    contentEl.textContent = data.pages[index].text;
  }

  /* ===== RAG 本体（診断付き） ===== */
  document.getElementById("ask").onclick = async () => {
    const q = question.value.trim();
    const answer = document.getElementById("answer");
    if (!q) return alert("質問を入力して");

    const memo = data.pages.map(
      p => `【${p.title}】\n${p.text}`
    ).join("\n\n---\n\n");

    const prompt = `
以下は自分のメモです。
この内容だけを根拠に答えてください。

${memo}

質問: ${q}
`;

    answer.textContent = "Gemini通信中…";

    try {
      const res = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + GEMINI_API_KEY,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ text: prompt }] }]
          })
        }
      );

      const raw = await res.text();
      console.log("Gemini raw:", raw);

      let json;
      try {
        json = JSON.parse(raw);
      } catch {
        answer.textContent = "JSON解析失敗:\n" + raw;
        return;
      }

      if (json.error) {
        answer.textContent = "Gemini API エラー:\n" +
          JSON.stringify(json.error, null, 2);
        return;
      }

      const text =
        json.candidates?.[0]?.content?.parts?.[0]?.text;

      if (!text) {
        answer.textContent =
          "形式不正:\n" + JSON.stringify(json, null, 2);
        return;
      }

      answer.textContent = text;

    } catch (e) {
      answer.textContent = "通信エラー:\n" + e.message;
    }
  };
});
</script>
</body>
</html>
