<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>インポートテキスト管理</title>

<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: system-ui, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  padding: 12px;
  box-sizing: border-box;
}

header {
  display: flex;
  gap: 8px;
  align-items: center;
}

h1 {
  margin: 0;
  font-size: 20px;
}

nav {
  display: flex;
  gap: 6px;
  margin: 10px 0;
  overflow-x: auto;
}

nav button {
  padding: 6px 10px;
}

#content, textarea {
  flex: 1;
  width: 100%;
  border: 1px solid #ccc;
  padding: 10px;
  box-sizing: border-box;
  white-space: pre-wrap;
}

textarea {
  display: none;
}

footer {
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <h1 id="pageTitle"></h1>
  <button id="editTitle">✏️ ページタイトル編集</button>
</header>

<nav id="nav"></nav>

<div id="content"></div>
<textarea id="editor"></textarea>

<footer>
  <button id="edit">✏️ 編集</button>
  <button id="save" style="display:none">💾 保存</button>
  <button id="add">＋ ページ追加</button>
</footer>

<script>
/* ===== データ ===== */
const data = JSON.parse(localStorage.getItem("pages")) || {
  pages: [
    { title: "ページ1", text: "" }
  ]
};

const nav = document.getElementById("nav");
const content = document.getElementById("content");
const editor = document.getElementById("editor");
const pageTitle = document.getElementById("pageTitle");
const editBtn = document.getElementById("edit");
const saveBtn = document.getElementById("save");

function saveAll() {
  localStorage.setItem("pages", JSON.stringify(data));
}

/* ===== URLからページ番号取得 ===== */
function getPageIndex() {
  const hash = location.hash.replace("#page-", "");
  const index = parseInt(hash, 10);
  return isNaN(index) ? 0 : index;
}

function setPageIndex(i) {
  location.hash = `page-${i}`;
}

/* ===== 描画 ===== */
function renderNav() {
  nav.innerHTML = "";
  data.pages.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.textContent = p.title;
    btn.onclick = () => setPageIndex(i);
    nav.appendChild(btn);
  });
}

function renderPage() {
  const i = getPageIndex();
  const page = data.pages[i];
  if (!page) return;

  pageTitle.textContent = page.title;
  content.textContent = page.text;
}

/* ===== 編集 ===== */
editBtn.onclick = () => {
  editor.value = content.textContent;
  content.style.display = "none";
  editor.style.display = "block";
  editBtn.style.display = "none";
  saveBtn.style.display = "inline";
};

saveBtn.onclick = () => {
  const i = getPageIndex();
  data.pages[i].text = editor.value;
  saveAll();
  editor.style.display = "none";
  content.style.display = "block";
  editBtn.style.display = "inline";
  saveBtn.style.display = "none";
  renderPage();
};

/* ===== タイトル編集 ===== */
document.getElementById("editTitle").onclick = () => {
  const i = getPageIndex();
  const t = prompt("ページタイトル", data.pages[i].title);
  if (t) {
    data.pages[i].title = t;
    saveAll();
    renderNav();
    renderPage();
  }
};

/* ===== ページ追加 ===== */
document.getElementById("add").onclick = () => {
  data.pages.push({ title: "新しいページ", text: "" });
  saveAll();
  const i = data.pages.length - 1;
  setPageIndex(i);
};

/* ===== 初期化 ===== */
window.addEventListener("hashchange", renderPage);

renderNav();
renderPage();
</script>

</body>
</html>
``
