<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>インポートテキスト管理</title>

<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: system-ui, sans-serif;
}
body { display: flex; }

#auth {
  margin: auto;
  padding: 20px;
  border: 1px solid #ccc;
}

#sidebar {
  width: 260px;
  border-right: 1px solid #ccc;
  padding: 10px;
  display: none;
  flex-direction: column;
}

#main {
  flex: 1;
  padding: 10px;
  display: none;
  flex-direction: column;
}

#pageList button {
  width: 100%;
  margin-bottom: 5px;
}
</style>

<!-- Firebase SDK（正しい書き方） -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>

<body>

<!-- ログイン -->
<div id="auth">
  <h2>ログイン / 新規登録</h2>
  <input id="email" placeholder="メールアドレス"><br><br>
  <input id="password" type="password" placeholder="パスワード"><br><br>
  <button id="login">ログイン / 登録</button>
</div>

<!-- サイドバー -->
<div id="sidebar">
  <button id="add">＋ ページ追加</button>
  <button id="remove">🗑 削除</button>
  <div id="pageList"></div>
</div>

<!-- メイン -->
<div id="main">
  <h1 id="pageTitle"></h1>
  <pre id="content"></pre>
  <textarea id="editor" style="display:none; width:100%; height:200px;"></textarea>
  <br>
  <button id="edit">編集</button>
  <button id="save" style="display:none;">保存</button>
  <button id="logout">ログアウト</button>
</div>

<script>
/* ===== Firebase 設定 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCnkShkUx2dj_nGn2-GuyNGShc5ooh55h8",
  authDomain: "importtext-b229d.firebaseapp.com",
  projectId: "importtext-b229d",
};
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* ===== DOM ===== */
const authDiv = document.getElementById("auth");
const sidebar = document.getElementById("sidebar");
const main = document.getElementById("main");

const email = document.getElementById("email");
const password = document.getElementById("password");
const login = document.getElementById("login");
const logout = document.getElementById("logout");

const pageList = document.getElementById("pageList");
const pageTitle = document.getElementById("pageTitle");
const content = document.getElementById("content");
const editor = document.getElementById("editor");

const edit = document.getElementById("edit");
const save = document.getElementById("save");
const add = document.getElementById("add");
const remove = document.getElementById("remove");

/* ===== 認証 ===== */
login.onclick = async () => {
  try {
    await auth.signInWithEmailAndPassword(email.value, password.value);
  } catch {
    await auth.createUserWithEmailAndPassword(email.value, password.value);
  }
};

logout.onclick = () => auth.signOut();

auth.onAuthStateChanged(user => {
  if (user) {
    authDiv.style.display = "none";
    sidebar.style.display = "flex";
    main.style.display = "flex";
  } else {
    authDiv.style.display = "block";
    sidebar.style.display = "none";
    main.style.display = "none";
  }
});

/* ===== データ ===== */
let data = { pages: [] };
let index = 0;

function render() {
  pageList.innerHTML = "";
  data.pages.forEach((p, i) => {
    const b = document.createElement("button");
    b.textContent = p.title;
    b.onclick = () => { index = i; render(); };
    pageList.appendChild(b);
  });
  if (data.pages[index]) {
    pageTitle.textContent = data.pages[index].title;
    content.textContent = data.pages[index].text;
  }
}

/* ===== Firestore ===== */
db.collection("app").doc("pages").onSnapshot(
  doc => {
    if (doc.exists) {
      data = doc.data();
    } else {
      data = { pages: [{ title: "ページ1", text: "" }] };
      db.collection("app").doc("pages").set(data);
    }
    render();
  },
  err => {
    alert("Firestoreエラー（ルール確認）");
    console.error(err);
  }
);

/* ===== 操作 ===== */
edit.onclick = () => {
  editor.value = content.textContent;
  editor.style.display = "block";
  content.style.display = "none";
  edit.style.display = "none";
  save.style.display = "inline";
};

save.onclick = () => {
  data.pages[index].text = editor.value;
  db.collection("app").doc("pages").set(data);
  editor.style.display = "none";
  content.style.display = "block";
  edit.style.display = "inline";
  save.style.display = "none";
};

add.onclick = () => {
  data.pages.push({ title: "新しいページ", text: "" });
  db.collection("app").doc("pages").set(data);
};

remove.onclick = () => {
  if (!confirm("削除しますか？")) return;
  data.pages.splice(index, 1);
  index = 0;
  db.collection("app").doc("pages").set(data);
};
</script>

</body>
</html>
