<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>YouTube × メモアプリ</title>

<style>
body { display:flex; font-family:sans-serif; margin:0 }

/* sidebar */
#sidebar { width:250px; border-right:1px solid #ccc; padding:10px }
#pageList button { width:100%; margin-bottom:4px }

/* main */
#main { flex:1; padding:10px }
textarea { width:100%; height:200px }

#videoArea { margin-top:20px }

/* サムネ */
#videoArea img {
  width:300px;
  display:block;
  margin-bottom:8px;
  cursor:pointer;
}
  .thumbBox {
  position: relative;
  width: 300px;
}

.thumbBox img {
  width: 100%;
  display: block;
}

.playBtn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 40px;
  color: white;
  background: rgba(0,0,0,0.5);
  border-radius: 50%;
  padding: 10px 18px;
  pointer-events: none;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

</head>

<body>

<div id="sidebar">
<button id="add">＋</button>
<button id="remove">削除</button>
<div id="pageList"></div>
</div>

<div id="main">
<h1 id="title"></h1>

<button id="editTitle">タイトル編集</button>
<button id="editCh">チャンネルID編集</button>

<div>ChannelID: <span id="chid"></span></div>

<textarea id="editor"></textarea>
<button id="save">保存</button>

<hr>

<h3>📺 今日の1本</h3>
<button onclick="randomVideo()">🎲 ランダム</button>

<div id="videoArea"></div>

</div>

<script>

/* ===== Firebase ===== */
firebase.initializeApp({
  apiKey:"AIzaSyCnkShkUx2dj_nGn2-GuyNGShc5ooh55h8",
  projectId:"importtext-b229d"
});
const db = firebase.firestore();

/* ===== 設定 ===== */
const API_KEY = "AIzaSyCVHzLcLLahGb87ulV-kRlR16pxP7ISbC4";
const USER = "user1";

/* ===== 状態 ===== */
let data = { pages:[] }
let videos = []
let currentVideo = null

/* ===== 初期化 ===== */
async function init() {
  const doc = await db.collection("app").doc(USER).get()

  if(doc.exists){
    data = doc.data()
  }else{
    data = { pages:[{title:"ページ1",text:"",channelId:""}] }
    save()
  }

  render()
}
init()

/* ===== 保存 ===== */
function save(){
  return db.collection("app").doc(USER).set(data)
}

/* ===== UI ===== */
function getIndex(){
  return parseInt(location.hash.replace("#",""))||0
}

function setIndex(i){
  location.hash = i
  render()
}

function render(){
  const list = document.getElementById("pageList")
  list.innerHTML=""

  data.pages.forEach((p,i)=>{
    const b=document.createElement("button")
    b.textContent=p.title
    b.onclick=()=>setIndex(i)
    list.appendChild(b)
  })

  const p = data.pages[getIndex()]

  document.getElementById("title").textContent=p.title
  document.getElementById("editor").value=p.text
  document.getElementById("chid").textContent=p.channelId||"未設定"
}

/* ===== CRUD ===== */
document.getElementById("add").onclick=()=>{
  data.pages.push({title:"新規",text:"",channelId:""})
  save().then(render)
}

document.getElementById("remove").onclick=()=>{
  data.pages.splice(getIndex(),1)
  save().then(()=>setIndex(0))
}

document.getElementById("save").onclick=()=>{
  data.pages[getIndex()].text=document.getElementById("editor").value
  save()
}

document.getElementById("editTitle").onclick=()=>{
  const i=getIndex()
  const t=prompt("タイトル",data.pages[i].title)
  if(!t)return
  data.pages[i].title=t
  save().then(render)
}

/* ===== チャンネル編集 ===== */
document.getElementById("editCh").onclick=()=>{
  const i=getIndex()
  const id=prompt("チャンネルID",data.pages[i].channelId)
  if(id===null)return
  data.pages[i].channelId=id
  videos = [] // ←動画キャッシュリセット（超重要）
  save().then(render)
}

/* ===== YouTube取得 ===== */
async function loadVideo(){

  const ch = data.pages[getIndex()].channelId

  if(!ch){
    alert("チャンネルID設定して")
    return
  }

  const res = await fetch(
    `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${ch}&part=snippet,id&maxResults=50`
  )

  const d = await res.json()

  if(!d.items){
    alert("APIエラー or キー確認")
    console.log(d)
    return
  }

  videos = d.items
    .filter(v=>v.id.videoId)
    .map(v=>({
      id:v.id.videoId,
      title:v.snippet.title,
      thumb:v.snippet.thumbnails.medium.url
    }))
}

/* ===== ランダム ===== */
async function randomVideo(){

  if(videos.length===0){
    await loadVideo()
    if(videos.length===0) return
  }

  const v = videos[Math.floor(Math.random()*videos.length)]
  currentVideo = v
  
  document.getElementById("videoArea").innerHTML =
  `
  <div class="thumbBox" onclick="openVideo()">
    <img src="${v.thumb}">
    <div class="playBtn">▶</div>
  </div>

  <h4>${v.title}</h4>
  <button onclick="openVideo()">開く</button>`

}

/* ===== 再生 ===== */
function openVideo(){
  if(!currentVideo) return
  window.open("https://youtube.com/watch?v="+currentVideo.id)
}

</script>

</body>
</html>
