<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>YouTube学習アプリ 完成版</title>

<style>
body { display:flex; margin:0; font-family:sans-serif }

/* sidebar */
#sidebar { width:250px; border-right:1px solid #ccc; padding:10px }
#pageList button { width:100%; margin-bottom:5px }

/* main */
#main { flex:1; padding:15px }

#videoArea img {
  width:300px;
  cursor:pointer;
  border-radius:6px;
}

#videoArea h3 {
  margin-bottom:5px;
}
</style>

https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js>
https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.jsscript>

</head>

<body>

<!-- ===== sidebar ===== -->
<div id="sidebar">
<button onclick="addPage()">＋追加</button>
<button onclick="removePage()">削除</button>
<div id="pageList"></div>
</div>

<!-- ===== main ===== -->
<div id="main">

<h2 id="title"></h2>
<button onclick="editTitle()">タイトル編集</button>
<button onclick="editChannel()">チャンネルID編集</button>

<div>Channel: <span id="chid"></span></div>

<textarea id="editor"></textarea>
<button onclick="saveText()">保存</button>

<hr>

<h3>📺 今日の1本</h3>
<button onclick="randomVideo()">🎲 ランダム</button>

<div id="videoArea"></div>

</div>

<script>

/* ===== Firebase ===== */
firebase.initializeApp({
  apiKey:"AIzaSyCnkShkUx2dj_nGn2-GuyNGShc5ooh55h8",
  projectId:"importtext-b229d"
});
const db = firebase.firestore();

/* ===== 設定 ===== */
const API_KEY = "AIzaSyCVHzLcLLahGb87ulV-kRlR16pxP7ISbC4";
const USER = "user1";

/* ===== 状態 ===== */
let data = { pages:[] }
let currentVideo = null

/* ===== 初期化 ===== */
async function init(){
  const doc = await db.collection("app").doc(USER).get()

  if(doc.exists){
    data = doc.data()
  }else{
    data = { pages:[{title:"ページ1",text:"",channelId:"",seen:[]}] }
    save()
  }

  render()
}
init()

/* ===== 保存 ===== */
function save(){
  return db.collection("app").doc(USER).set(data)
}

/* ===== UI ===== */
function getIndex(){
  return parseInt(location.hash.replace("#",""))||0
}

function setIndex(i){
  location.hash = i
  render()
}

function render(){
  const list = document.getElementById("pageList")
  list.innerHTML=""

  data.pages.forEach((p,i)=>{
    const b=document.createElement("button")
    b.textContent=p.title
    b.onclick=()=>setIndex(i)
    list.appendChild(b)
  })

  const p = data.pages[getIndex()]

  document.getElementById("title").textContent=p.title
  document.getElementById("editor").value=p.text
  document.getElementById("chid").textContent=p.channelId||"未設定"
}

/* ===== CRUD ===== */
function addPage(){
  data.pages.push({title:"新規",text:"",channelId:"",seen:[]})
  save().then(render)
}

function removePage(){
  data.pages.splice(getIndex(),1)
  save().then(()=>setIndex(0))
}

function saveText(){
  data.pages[getIndex()].text=document.getElementById("editor").value
  save()
}

function editTitle(){
  const i=getIndex()
  const t=prompt("タイトル",data.pages[i].title)
  if(!t)return
  data.pages[i].title=t
  save().then(render)
}

function editChannel(){
  const i=getIndex()
  const id=prompt("チャンネルID",data.pages[i].channelId)
  if(id===null)return

  data.pages[i].channelId=id
  data.pages[i].seen=[] // リセット

  save().then(render)
}

/* ===== YouTube 全動画取得 ===== */
async function loadAllVideos(channelId){

  let all = []
  let nextPage = ""

  do{
    const res = await fetch(
      "https://www.googleapis.com/youtube/v3/search?key=" +
      API_KEY +
      "&channelId=" +
      channelId +
      "&part=snippet,id&maxResults=50&pageToken=" + nextPage
    )

    const d = await res.json()

    const vids = d.items
      .filter(v=>v.id.videoId)
      .map(v=>({
        id:v.id.videoId,
        title:v.snippet.title,
        thumb:v.snippet.thumbnails.medium.url
      }))

    all = all.concat(vids)
    nextPage = d.nextPageToken || ""

  }while(nextPage)

  return all
}

/* ===== ランダム ===== */
async function randomVideo(){

  const page = data.pages[getIndex()]

  if(!page.channelId){
    alert("チャンネルID設定して")
    return
  }

  const allVideos = await loadAllVideos(page.channelId)

  const unseen = allVideos.filter(v=>!page.seen.includes(v.id))

  if(unseen.length===0){
    document.getElementById("videoArea").innerHTML="🎉 全部見た！"
    return
  }

  const v = unseen[Math.floor(Math.random()*unseen.length)]
  currentVideo = v

  document.getElementById("videoArea").innerHTML=`
    <h3>${v.title}</h3>
    ${v.thumb}
  `
}

/* ===== 開く＝既読 ===== */
function openVideo(){

  const page = data.pages[getIndex()]

  page.seen.push(currentVideo.id)
  save()

  window.open("https://youtube.com/watch?v="+currentVideo.id)
}

</script>

</body>
</html>
