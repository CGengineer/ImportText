<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>YouTube × メモアプリ</title>

<style>
body { display:flex; font-family:sans-serif; margin:0 }

/* sidebar */
#sidebar { width:250px; border-right:1px solid #ccc; padding:10px }
#pageList button { width:100%; margin-bottom:4px }

/* main */
#main { flex:1; padding:10px }

#videoArea { margin-top:20px }

/* サムネ */
#videoArea img {
  width:300px;
  display:block;
  margin-bottom:8px;
  cursor:pointer;
}

/* 再生ボタン */
.thumbBox { position:relative; width:300px }
.thumbBox img { width:100% }
.playBtn {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  font-size:40px;
  color:white;
  background:rgba(0,0,0,0.5);
  border-radius:50%;
  padding:10px 18px;
  pointer-events:none;
}

/* 進捗バー */
#progressBar {
  width:300px;
  height:10px;
  background:#ddd;
  margin-top:10px;
}
#progressFill {
  height:100%;
  width:0%;
  background:#4caf50;
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  
</head>

<body>

<div id="login">
<h3>ログイン</h3>
<input id="email" placeholder="メール"><br><br>
<input id="password" type="password" placeholder="パスワード"><br><br>
<button id="loginBtn">ログイン</button>
<button id="registerBtn">新規登録</button>
</div>
  
<div id="sidebar">
<button id="add">＋</button>
<button id="remove">削除</button>
<div id="pageList"></div>
</div>

<div id="main">
<h1 id="title"></h1>

<button id="editTitle">タイトル編集</button>
<button id="editCh">チャンネルID編集</button>

<div>ChannelID: <span id="chid"></span></div>

<hr>

<h3>📺 今日の1本</h3>
<button onclick="randomVideo()">🎲 ランダム</button>

<div id="videoArea"></div>

<div>残り：<span id="remain">-</span>本</div>
<div>視聴済：<span id="done">-</span>本</div>
<div id="progressBar">
  <div id="progressFill"></div>
</div>

</div>

<script>

/* ===== Firebase ===== */
firebase.initializeApp({
  apiKey:"AIzaSyCnkShkUx2dj_nGn2-GuyNGShc5ooh55h8",
  projectId:"importtext-b229d"
});
const db = firebase.firestore();

/* ===== 設定 ===== */
const API_KEY = "AIzaSyCVHzLcLLahGb87ulV-kRlR16pxP7ISbC4";
let currentUser = null;

/* ===== 状態 ===== */
let data = { pages:[] }
let videos = []
let currentVideo = null

/* ===== 初期化 ===== */
async function init() {

firebase.auth().onAuthStateChanged(user => {
  if(user){
    currentUser = user.uid;
    document.getElementById("login").style.display = "none";
    initApp();
  }else{
    document.getElementById("login").style.display = "block";
  }
});

  render()
}
init()


function save(){
  return db.collection("app").doc(currentUser).set(data)
}


/* ===== UI ===== */
function getIndex(){
  return parseInt(location.hash.replace("#",""))||0
}

function setIndex(i){
  location.hash = i
  render()
 
  videos = []
  document.getElementById("videoArea").innerHTML = ""

  updateProgress()

  randomVideo() // ←追加（自動表示


}

function render(){
  const list = document.getElementById("pageList")
  list.innerHTML=""

  

  data.pages.forEach((p,i)=>{
    const b=document.createElement("button")
    b.textContent=p.title
    b.onclick=()=>setIndex(i)
    list.appendChild(b)
  })

  const p = data.pages[getIndex()]

  document.getElementById("title").textContent=p.title
  document.getElementById("chid").textContent=p.channelId||"未設定"
}

/* ===== CRUD ===== */
add.onclick=()=>{
  data.pages.push({title:"新規",channelId:"",seen:[]})
  save().then(render)
}

remove.onclick=()=>{
  data.pages.splice(getIndex(),1)
  save().then(()=>setIndex(0))
}

editTitle.onclick=()=>{
  const i=getIndex()
  const t=prompt("タイトル",data.pages[i].title)
  if(!t)return
  data.pages[i].title=t
  save().then(render)
}

editCh.onclick=()=>{
  const i=getIndex()
  const id=prompt("チャンネルID",data.pages[i].channelId)
  if(id===null)return
  data.pages[i].channelId=id
  data.pages[i].seen=[]
  data.pages[i].videos=[] // ←追加
  videos=[]

  // ✅ キャッシュ削除（ここが追加ポイント）
  db.collection("app").doc(currentUser).update({
    videos: null,
    channelId: null
  })

  save().then(render)
}

/* ===== 動画取得 ===== */async function loadVideo(){

  const pageIndex = getIndex()
  const p = data.pages[pageIndex]

  if(!p) return

  // ✅ キャッシュあったら即使う
  if(p.videos && p.videos.length > 0){

    videos = p.videos

    const ch = p.channelId

    // ✅ 最新だけ追加
    const res = await fetch(
      `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${ch}&part=snippet,id&order=date&maxResults=10`
    )

    const d = await res.json()

    const latest = d.items
      .filter(v => v.id.videoId)
      .map(v => ({
        id: v.id.videoId,
        title: v.snippet.title,
        thumb: v.snippet.thumbnails.medium.url
      }))

    latest.forEach(v => {
      if(!videos.find(x => x.id === v.id)){
        videos.unshift(v)
      }
    })

    p.videos = videos
    save()

    updateProgress()
    return
  }

  const ch = p.channelId
  if(!ch){ alert("チャンネルID設定して"); return }

  // ✅ uploads取得
  const chRes = await fetch(
    `https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${ch}&key=${API_KEY}`
  )

  const chData = await chRes.json()
  const uploadsId = chData.items[0].contentDetails.relatedPlaylists.uploads

  let allVideos = []
  let nextPageToken = ""

  do {
    const res = await fetch(
      `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${uploadsId}&maxResults=50&pageToken=${nextPageToken}&key=${API_KEY}`
    )

    const d = await res.json()

    const vids = d.items.map(v => ({
      id: v.snippet.resourceId.videoId,
      title: v.snippet.title,
      thumb: v.snippet.thumbnails.medium.url
    }))

    allVideos = allVideos.concat(vids)
    nextPageToken = d.nextPageToken || ""

  } while(nextPageToken)

  videos = allVideos

  // ✅ 保存
  p.videos = videos
  save()

  updateProgress()
}
/* ===== ランダム ===== */
async function randomVideo(){

  if(videos.length===0){
    await loadVideo()
    if(videos.length===0) return
  }

  const page = data.pages[getIndex()]
  const unseen = videos.filter(v => !page.seen.includes(v.id))

  if(unseen.length===0){
    videoArea.innerHTML="🎉 全部見た！"
    return
  }

  const v = unseen[Math.floor(Math.random()*unseen.length)]
  currentVideo = v


videoArea.innerHTML =
`
<div class="thumbBox" onclick="openVideo()">
  <img src="${v.thumb}">
  <div class="playBtn">▶</div>
</div>

<a href="https://youtube.com/watch?v=${v.id}" target="_blank">
  ${v.title}
</a>
`;

}

/* ===== 再生＆既読 ===== */
function openVideo(){

  const page = data.pages[getIndex()]

  if(!page.seen.includes(currentVideo.id)){
    page.seen.push(currentVideo.id)
    save()
  }

  updateProgress()

  window.open("https://youtube.com/watch?v="+currentVideo.id)
}

/* ===== 進捗 ===== */
function updateProgress(){
  const page = data.pages[getIndex()]
  if(!videos.length){ return }

  const total = videos.length
  const done = page.seen.length
  const remain = total - done

  document.getElementById("remain").textContent = remain
  document.getElementById("done").textContent = done
  const percent = (done / total) * 100
  document.getElementById("progressFill").style.width = percent + "%"
}

  loginBtn.onclick = async () => {
  await firebase.auth().signInWithEmailAndPassword(
    email.value,
    password.value
  );
};

registerBtn.onclick = async () => {
  await firebase.auth().createUserWithEmailAndPassword(
    email.value,
    password.value
  );
};

  async function initApp(){
  const doc = await db.collection("app").doc(currentUser).get()

  if(doc.exists){
    data = doc.data()
  }else{
    data = { pages:[{title:"ページ1",channelId:"",seen:[]}] }
    save()
  }

  render()
}
</script>

</body>
</html>
