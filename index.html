<h2>📺 今日の1本</h2>
<button onclick="getRandomVideo()">🎲 ランダム生成</button>
<div id="videoArea"></div>

<script>
/* ===== YouTube設定 ===== */
const API_KEY = "AIzaSyCVHzLcLLahGb87ulV-kRlR16pxP7ISbC4;
const CHANNEL_ID = "UCEixleMT76xDzoiEb9ZA7XA";

/* ===== データ ===== */
let videos = [];
let currentVideo = null;

/* ===== 動画取得 ===== */
async function loadVideos(uid) {
  const ref = db.collection("videos").doc(uid);

  const res = await fetch(
    `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet,id&order=date&maxResults=50`
  );

  const data = await res.json();

  let newVideos = data.items
    .filter(v => v.id.videoId)
    .map(v => ({
      id: v.id.videoId,
      title: v.snippet.title,
      seen: false
    }));

  /* Firebaseから既読取得 */
  const doc = await ref.get();
  if (doc.exists) {
    const seenList = doc.data().seen || [];
    newVideos.forEach(v => {
      if (seenList.includes(v.id)) v.seen = true;
    });
  }

  videos = newVideos;
}

/* ===== ランダム生成 ===== */
function getRandomVideo() {
  const unseen = videos.filter(v => !v.seen);

  if (unseen.length === 0) {
    document.getElementById("videoArea").innerHTML = "🎉 全部見た！";
    return;
  }

  const v = unseen[Math.floor(Math.random() * unseen.length)];
  currentVideo = v;

  document.getElementById("videoArea").innerHTML = `
    <h3>${v.title}</h3>
    <button onclick="watchVideo()">▶ 見に行く</button>
  `;
}

/* ===== 視聴処理 ===== */
async function watchVideo() {
  if (!currentVideo || !currentUserId) return;

  currentVideo.seen = true;

  /* Firebase保存 */
  const seenIds = videos
    .filter(v => v.seen)
    .map(v => v.id);

  await db.collection("videos")
    .doc(currentUserId)
    .set({ seen: seenIds });

  window.open(
    `https://www.youtube.com/watch?v=${currentVideo.id}`,
    "_blank"
  );

  document.getElementById("videoArea").innerHTML = "✅ 視聴済みに登録";
}

/* ===== ログイン時に動画読み込み ===== */
let currentUserId = null;

function initApp(uid) {
  currentUserId = uid;

  /* ← ここにこれ追加 */
  loadVideos(uid);

  /* 既存コードそのまま */
}
</script>
