<body>

<div id="header">
  <div id="appName">🎀未知リンク</div>

    <div id="userArea">
    <span id="userEmail"></span>
    <div id="userIcon" onclick="toggleMenu()"></div>
  </div>
</div>
  
<div id="userMenu">
  <div onclick="logout()">別のアカウントでログイン</div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div>読み込み中…</div>
</div>
<div id="overlay"></div>

<div id="login">
<h3>ログイン</h3>
<input id="email" placeholder="メール"><br><br>
<input id="password" type="password" placeholder="パスワード"><br><br>

<button id="googleLoginBtn" class="fullBtn">
  Googleでログイン（登録不要）
</button>

<div class="rowBtns">
  <button id="loginBtn">その他メールでログイン</button>
  <button id="registerBtn">新規登録</button>
</div>






</div>

  
  
<div id="sidebar">
<button id="add">チャンネル追加</button>
<button id="remove">チャンネル削除</button>
<div id="pageList"></div>
</div>

<div id="main">
<h1 id="title"></h1>

<button id="editTitle">タイトル編集</button>
<button id="editCh">チャンネルID設定</button>

<div>ChannelID: <span id="chid"></span></div>

<hr>

<h3>📺 今日の1本</h3>
<button onclick="randomVideo()">🎲 ランダム</button>

<div id="videoArea"></div>

<div>残り：<span id="remain">-</span>本</div>
<div>視聴済：<span id="done">-</span>本</div>
<div>新着：<span id="newCount">0</span>本</div>

  <div id="progressBar">
  <div id="progressFill"></div>
</div>

</div>

<script>

function toggleMenu(){
  const menu = document.getElementById("userMenu")
  menu.style.display = menu.style.display === "block" ? "none" : "block"
}

function logout(){
  firebase.auth().signOut()
}
function showLoading(){
  document.getElementById("loading").style.display = "flex";
}

function hideLoading(){
  document.getElementById("loading").style.display = "none";
}
/* ===== Firebase ===== */
firebase.initializeApp({
  apiKey: "AIzaSyCnkShkUx2dj_nGn2-GuyNGShc5ooh55h8",
  authDomain: "importtext-b229d.firebaseapp.com",
  projectId: "importtext-b229d"
});
const db = firebase.firestore();

/* ===== 設定 ===== */
const API_KEY = "AIzaSyCVHzLcLLahGb87ulV-kRlR16pxP7ISbC4";
let currentUser = null;

/* ===== 状態 ===== */
let data = { pages:[] }
let videos = []
let currentVideo = null
let newCount = 0
  
/* ===== 初期化 ===== */
async function init(){

firebase.auth().onAuthStateChanged(user => {
  if(user){
    currentUser = user.uid
document.getElementById("login").style.display = "none"
document.getElementById("overlay").style.display = "none"

    document.getElementById("userEmail").textContent = user.email

    const icon = document.getElementById("userIcon") // ← これ追加

    if(user.photoURL){
      icon.style.backgroundImage = `url(${user.photoURL})`
      icon.style.backgroundSize = "cover"
      icon.style.backgroundPosition = "center"
      icon.style.backgroundColor = "transparent"
    }else{
      const color = "#" + user.uid.slice(0, 6)
      icon.style.background = color
      icon.style.backgroundImage = "none"
    }

    initApp()

  }else{
    document.getElementById("login").style.display = "block"
      document.getElementById("overlay").style.display = "block" // ← これ
  }
})
}

  
init()


function save(){
  return db.collection("app").doc(currentUser).set(data)
}


/* ===== UI ===== */
function getIndex(){
  return parseInt(location.hash.replace("#",""))||0
}

function setIndex(i){
  location.hash = i
  render()

  const p = data.pages[i]

  if(p.videos && p.videos.length > 0){
    videos = p.videos
    updateProgress()
    randomVideo()
  }else{
    videos = []
    document.getElementById("videoArea").innerHTML = ""
    updateProgress()
    loadVideo()
  }
}

function render(){
  const list = document.getElementById("pageList")
  list.innerHTML=""

  

  data.pages.forEach((p,i)=>{
    const b=document.createElement("button")
    b.textContent=p.title
    b.onclick=()=>setIndex(i)
    list.appendChild(b)
  })

  const p = data.pages[getIndex()]

  document.getElementById("title").textContent=p.title
  document.getElementById("chid").textContent=p.channelId||"未設定"
}

/* ===== CRUD ===== */
add.onclick=()=>{
  data.pages.push({title:"新規",channelId:"",seen:[]})
  save().then(render)
}

remove.onclick=()=>{
  data.pages.splice(getIndex(),1)
  save().then(()=>setIndex(0))
}

editTitle.onclick=()=>{
  const i=getIndex()
  const t=prompt("タイトル",data.pages[i].title)
  if(!t)return
  data.pages[i].title=t
  save().then(render)
}

editCh.onclick = async () => {
  const i = getIndex()
  const id = prompt("チャンネルID", data.pages[i].channelId)
  if(id === null) return

  // ✅ まず即反映（ここがポイント）
  data.pages[i].channelId = id
  data.pages[i].seen = []
  data.pages[i].videos = []
  videos = []

  render()        // ← 先に画面へ反映
  showLoading()   // ← その後ローディング

  await db.collection("app").doc(currentUser).update({
    videos: null,
    channelId: null
  })

  await save()

  // ✅ 実際の取得開始
  await loadVideo()
}


/* ===== 動画取得 ===== */
 /* ===== 動画取得 ===== */
async function loadVideo(){
try{
  const pageIndex = getIndex()
  const p = data.pages[pageIndex]

  if(!p) return

  // ✅ キャッシュあったら即使う
  if(p.videos && p.videos.length > 0){

    videos = p.videos
    const ch = p.channelId

    // ✅ 最新だけ追加（search）
    const res = await fetch(
      `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${ch}&part=snippet,id&order=date&maxResults=10`
    )
    const d = await res.json()

    const latest = d.items
      .filter(v => v.id.videoId)
      .map(v => ({
        id: v.id.videoId,
        title: v.snippet.title,
        thumb: v.snippet.thumbnails.medium.url
      }))


    newCount = 0   // ← 毎回リセット
    
    latest.forEach(v => {
      if(!videos.find(x => x.id === v.id)){
        videos.unshift(v)
        newCount++          // ← 新着カウント
      }
    })

    p.videos = videos
    save()
    updateProgress()
    return
  }

  const ch = p.channelId
  // ✅ uploads 取得（channels）

const chRes = await fetch(
  `https://www.googleapis.com/youtube/v3/channels?part=contentDetails,snippet&id=${ch}&key=${API_KEY}`
)

  const chData = await chRes.json()
  const uploadsId =
    chData.items[0].contentDetails.relatedPlaylists.uploads

  const channelName =
    chData.items[0].snippet.title
  
  // ✅ ページタイトルをチャンネル名にする
  p.title = channelName
  save()
  render()

  
  let allVideos = []
  let nextPageToken = ""

  // ✅ 全動画取得（playlistItems）
  do {
    const res = await fetch(
      `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${uploadsId}&maxResults=50&pageToken=${nextPageToken}&key=${API_KEY}`
    )
    const d = await res.json()

    const vids = d.items.map(v => ({
      id: v.snippet.resourceId.videoId,
      title: v.snippet.title,
      thumb: v.snippet.thumbnails.medium.url
    }))

    allVideos = allVideos.concat(vids)
    nextPageToken = d.nextPageToken || ""

  } while(nextPageToken)

  videos = allVideos

  // ✅ 保存
  p.videos = videos
  save()
  updateProgress()
    randomVideo()
} finally{
      hideLoading(); // ← 追加（必ず消える）
}
}
/* ===== ランダム ===== */
async function randomVideo(){

  if(videos.length===0){
    await loadVideo()
    if(videos.length===0) return
  }

  const page = data.pages[getIndex()]
  const unseen = videos.filter(v => !page.seen.includes(v.id))

  if(unseen.length===0){
    videoArea.innerHTML="🎉 全部見た！"
    return
  }

  const v = unseen[Math.floor(Math.random()*unseen.length)]
  currentVideo = v


videoArea.innerHTML =
`
<div class="thumbBox" onclick="openVideo()">
  <img src="${v.thumb}">
  <div class="playBtn">▶</div>
</div>

<a href="https://youtube.com/watch?v=${v.id}" target="_blank">
  ${v.title}
</a>
`;

}

/* ===== 再生＆既読 ===== */
function openVideo(){

  const page = data.pages[getIndex()]

  if(!page.seen.includes(currentVideo.id)){
    page.seen.push(currentVideo.id)
    save()
  }

  updateProgress()

  window.open("https://youtube.com/watch?v="+currentVideo.id)
}

/* ===== 進捗 ===== */
function updateProgress(){
  const page = data.pages[getIndex()]
  if(!videos.length){ return }

  const total = videos.length
  const done = page.seen.length
  const remain = total - done
  

  document.getElementById("remain").textContent = remain
  document.getElementById("done").textContent = done
  document.getElementById("newCount").textContent = newCount
  const percent = (done / total) * 100
  document.getElementById("progressFill").style.width = percent + "%"

  
}
const loginBtn = document.getElementById("loginBtn")
  loginBtn.onclick = async () => {
  await firebase.auth().signInWithEmailAndPassword(
    email.value,
    password.value
  );
};

registerBtn.onclick = async () => {
  await firebase.auth().createUserWithEmailAndPassword(
    email.value,
    password.value
  );
};
  // ✅ Googleログイン（これが無かった）
const googleProvider = new firebase.auth.GoogleAuthProvider();

googleLoginBtn.onclick = async () => {
  try {
    await firebase.auth().signInWithPopup(googleProvider);
  } catch (e) {
    console.error(e);
    alert(e.message);
  }
};

  async function initApp(){
  const doc = await db.collection("app").doc(currentUser).get()

  if(doc.exists){
    data = doc.data()
  }else{
    data = { pages:[{title:"チャンネル１",channelId:"",seen:[]}] }
    save()
  }

  render()

    
// ✅ これ追加（最初のページを表示）
  setIndex(0)

// ✅ 起動時に新着チェックを必ず1回
loadVideo()

}
</script>

</body>
